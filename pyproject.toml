[project]
name = "schnorr-lab"
version = "0.2.0"            # 0.2 = segundo avance
description = "Protocolo de identificación de Schnorr implementado desde cero, con laboratorio de ataques y API HTTP."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["sympy", "matplotlib", "fastapi", "uvicorn", "httpx"]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Distribución plana: se declaran los paquetes para que `pip install -e ".[dev]"` funcione.
[tool.setuptools]
packages = ["core", "protocol", "attacks", "benchmark", "api"]
py-modules = ["demo", "http_client"]

[tool.setuptools.package-data]
core = ["groups.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["req(id): requerimiento que cubre la prueba (R1–R11)", "slow: genera grupos grandes"]
