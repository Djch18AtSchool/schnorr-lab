[project]
name = "schnorr-lab"
version = "0.3.0"            # 0.3 = entrega final
description = "Laboratorio de autenticación sin contraseñas: protocolo de Schnorr desde cero, banco y app del celular en vivo, ataques y mediciones."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["sympy", "matplotlib", "fastapi", "uvicorn", "httpx", "argon2-cffi", "pyotp"]

[project.optional-dependencies]
dev = ["pytest"]
bench = ["gmpy2"]   # solo para comparar backends aritméticos en benchmark/latency.py (R7)

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Distribución plana: se declaran los paquetes para que `pip install -e ".[dev]"` funcione.
[tool.setuptools]
packages = ["core", "protocol", "attacks", "benchmark", "api", "infra", "mechanisms", "mechanisms.zkp",
            "mechanisms.password", "mechanisms.totp", "mechanisms.srp", "client_app"]
py-modules = ["demo", "http_client", "lab"]

[tool.setuptools.package-data]
core = ["groups.json"]
client_app = ["static/*.html", "static/*.css", "static/js/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["req(id): requerimiento que cubre la prueba (R1–R11; C1–C5 para la comparación de mecanismos)",
           "slow: genera grupos grandes"]
filterwarnings = ["ignore:Using .httpx. with .starlette.testclient. is deprecated"]
